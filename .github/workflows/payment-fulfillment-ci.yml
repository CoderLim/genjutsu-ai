name: Payment Fulfillment CI

on:
  pull_request:
    paths:
      - 'src/modules/payment/service.ts'
      - 'src/modules/payment/checkout-fulfillment.ts'
      - 'src/modules/payment/checkout-fulfillment.service.test.ts'
      - 'src/modules/payment/fulfillment-idempotency.test.ts'
      - 'src/config/db/schema.*.ts'
      - 'docs/migrations/**'
      - '.github/workflows/payment-fulfillment-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Payment ledger idempotency tests
        run: node --import tsx --test src/modules/payment/fulfillment-idempotency.test.ts src/modules/payment/checkout-fulfillment.service.test.ts src/modules/payment/checkout-amount.test.ts
      - name: Production build (no deploy)
        run: pnpm build
      - name: Check payment and schema TypeScript errors
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false > tsc-report.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          changed="$(grep -E '^src/(modules/payment/(service|checkout-fulfillment|checkout-fulfillment\.service|fulfillment-idempotency\.test)\.ts|config/db/schema\.(sqlite|postgres|mysql)\.ts)' tsc-report.txt || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi
          echo "::warning title=Existing TypeScript debt::Other TypeScript errors may exist."
          grep -m 5 'error TS' tsc-report.txt || true
