name: D1 Genjutsu Today Diagnostics

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/d1-genjutsu-today-diagnostics.yaml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi
          {
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}"
            echo "CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}"
            echo "CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}"
          } >> "$GITHUB_ENV"

      - name: Query today's Genjutsu production D1
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.98.0"
          START_MS=1791043200000
          END_MS=1791129600000

          echo "=== TODAY_STATUS_COUNTS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT status, COUNT(*) AS count
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS
            GROUP BY status ORDER BY count DESC;
          "

          echo "=== TODAY_STAGE_PROVIDER_COUNTS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT status,
                   COALESCE(json_extract(task_info, '$.attemptStage'), '(none)') AS attempt_stage,
                   provider,
                   COUNT(*) AS count
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS
            GROUP BY status, attempt_stage, provider
            ORDER BY count DESC, status, attempt_stage;
          "

          echo "=== TODAY_FAILURE_CODES ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT status,
                   COALESCE(json_extract(task_result, '$.stage'), '') AS failure_stage,
                   COALESCE(json_extract(task_result, '$.errorCode'), '') AS error_code,
                   COALESCE(json_extract(task_result, '$.fileType'), '') AS file_type,
                   COALESCE(json_extract(task_result, '$.fileIndex'), '') AS file_index,
                   COUNT(*) AS count
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS
              AND (status='failed_preflight' OR json_extract(task_result, '$.errorCode') IS NOT NULL)
            GROUP BY status, failure_stage, error_code, file_type, file_index
            ORDER BY count DESC;
          "

          echo "=== TODAY_UPLOAD_DIAGNOSTICS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              SUM(CASE WHEN json_extract(task_info, '$.uploadRecovery.recovered') = 1 THEN 1 ELSE 0 END) AS recovered_count,
              SUM(CASE WHEN json_array_length(json_extract(task_info, '$.uploadRetrySuccesses')) > 0 THEN 1 ELSE 0 END) AS retry_success_records,
              SUM(CASE WHEN json_extract(task_info, '$.uploadRecovery.r2ObjectExists') = 1 THEN 1 ELSE 0 END) AS r2_exists_after_error,
              SUM(CASE WHEN json_extract(task_info, '$.uploadRecovery.r2ObjectExists') = 0 THEN 1 ELSE 0 END) AS r2_missing_after_error
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS;
          "

          echo "=== TODAY_CREDIT_AND_COST ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              COUNT(*) AS total,
              COUNT(DISTINCT user_id) AS users,
              SUM(CASE WHEN status='insufficient_credits' THEN 1 ELSE 0 END) AS insufficient,
              SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) AS completed,
              SUM(CASE WHEN status IN ('reserved','submitting','submitted','completed','submission_unknown','refunding','refunded') THEN 1 ELSE 0 END) AS reached_reserve_or_later,
              COALESCE(SUM(CASE WHEN status='completed' THEN cost_credits ELSE 0 END),0) AS completed_credits
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS;
          "

          echo "=== TODAY_RECENT_NO_PII ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              substr(id,1,8) AS id8,
              datetime(created_at/1000,'unixepoch') AS created_utc,
              status,
              COALESCE(json_extract(task_info, '$.attemptStage'), '(none)') AS attempt_stage,
              provider,
              cost_credits,
              COALESCE(json_extract(task_result, '$.errorCode'), '') AS error_code,
              COALESCE(json_extract(task_info, '$.uploadRecovery.recovered'), '') AS recovered,
              COALESCE(json_array_length(json_extract(task_info, '$.uploadRetrySuccesses')), 0) AS retry_successes
            FROM ai_task
            WHERE scene='genjutsu' AND created_at >= $START_MS AND created_at < $END_MS
            ORDER BY created_at DESC LIMIT 80;
          "
