name: Reconcile Waffo Orders

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/reconcile-waffo-orders.yaml'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile created Waffo orders
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi

          RAW="$(npx wrangler d1 execute genjutsu-ai-db --remote --json --command="
            SELECT order_no
            FROM \"order\"
            WHERE payment_provider='waffo' AND status='created'
            ORDER BY created_at DESC;
          ")"

          ORDERS="$(RAW="$RAW" node - <<'NODE'
          const parsed = JSON.parse(process.env.RAW || '[]');
          const batches = Array.isArray(parsed) ? parsed : [];
          const rows = batches.flatMap((b) => b.results || []);
          for (const row of rows) if (row.order_no) console.log(row.order_no);
          NODE
          )"

          while IFS= read -r order_no; do
            [ -n "$order_no" ] || continue
            echo "Reconciling $order_no"
            curl --silent --show-error --location --max-time 30               "https://genjutsuai.net/api/payment/callback?order_no=$order_no&redirect=https%3A%2F%2Fgenjutsuai.net%2Fsettings%2Fbilling"               -o /dev/null || true
          done <<< "$ORDERS"

          echo '=== AFTER RECONCILE ==='
          npx wrangler d1 execute genjutsu-ai-db --remote --json --command="
            SELECT o.order_no, o.status, o.amount, o.currency, o.product_id,
                   o.credits_amount, o.transaction_id, o.paid_at,
                   (SELECT COUNT(*) FROM credit c WHERE c.order_no=o.order_no AND c.transaction_type='grant') AS credit_grants
            FROM \"order\" o
            WHERE o.payment_provider='waffo'
            ORDER BY o.created_at DESC
            LIMIT 20;
          "
