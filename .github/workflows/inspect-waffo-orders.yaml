name: Inspect Waffo Production Orders

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/inspect-waffo-orders.yaml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Inspect production Waffo orders
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi
          echo '=== CONFIG ==='
          npx wrangler d1 execute genjutsu-ai-db --remote --json --command="
            SELECT name, value
            FROM config
            WHERE name IN ('app_url','waffo_environment','waffo_store_id','default_payment_provider');
          "
          echo '=== WAFFO ORDERS ==='
          npx wrangler d1 execute genjutsu-ai-db --remote --json --command="
            SELECT order_no, status, amount, currency, product_id, credits_amount,
                   payment_session_id, transaction_id, paid_at, created_at
            FROM \"order\"
            WHERE payment_provider='waffo'
            ORDER BY created_at DESC
            LIMIT 20;
          "
