# Production deploy workflow. Android upload diagnostics rollout 2026-10-04.
# Manual production deploy: 2026-10-05 upload-hint copy.
name: Deploy Cloudflare Worker

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-deploy.yaml'
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail

          # Support the common secret names already used across the repos.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && { [ -z "${CLOUDFLARE_API_KEY:-}" ] || [ -z "${CLOUDFLARE_EMAIL:-}" ]; }; then
            echo "Cloudflare credentials are missing. Configure CLOUDFLARE_API_TOKEN/CF_API_TOKEN, or a Global API Key plus email."
            exit 1
          fi

          npx wrangler whoami

          cp wrangler.example.jsonc wrangler.jsonc

          D1_JSON="$(npx wrangler d1 list --json)"
          D1_ID="$(D1_JSON="$D1_JSON" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '[]');
          const list = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const db = list.find((item) => item && (item.name === 'genjutsu-ai-db' || item.database_name === 'genjutsu-ai-db'));
          if (!db) process.exit(2);
          process.stdout.write(String(db.uuid || db.id || db.database_id || ''));
          NODE
          )"

          if [ -z "$D1_ID" ]; then
            echo "Cloudflare D1 database genjutsu-ai-db was not found."
            exit 1
          fi

          D1_ID="$D1_ID" node - <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('REPLACE_WITH_OUTPUT_OF_WRANGLER_D1_CREATE', process.env.D1_ID);
          fs.writeFileSync(path, text);
          NODE

          if [ -n "${ENV_PRODUCTION:-}" ]; then
            printf '%s\n' "$ENV_PRODUCTION" > .env.production
          else
            : > .env.production
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const path = '.env.production';
          const desired = {
            VITE_APP_URL: 'https://genjutsuai.net',
            VITE_APP_NAME: 'Genjutsu AI',
            DATABASE_PROVIDER: 'd1',
          };
          const source = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
          const lines = source.split(/\r?\n/).filter(Boolean);
          const keys = new Set(Object.keys(desired));
          const kept = lines.filter((line) => {
            const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=/);
            return !match || !keys.has(match[1]);
          });
          for (const [key, value] of Object.entries(desired)) kept.push(`${key}=${value}`);
          fs.writeFileSync(path, kept.join('\n') + '\n');
          NODE

          DATABASE_PROVIDER=d1 VITE_APP_URL=https://genjutsuai.net VITE_APP_NAME="Genjutsu AI" pnpm run cf:deploy

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://genjutsuai.net/ -o /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://genjutsuai.net/api/config/public -o /dev/null
          echo "Production smoke checks passed."
