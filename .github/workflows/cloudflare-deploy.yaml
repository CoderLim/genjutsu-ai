# Read-only diagnostic branch workflow. Never deploys production.
name: Diagnose Post-P0 Uploads

on:
  push:
    branches: ['diagnose/post-p0-upload-20261004']
    paths:
      - '.github/workflows/cloudflare-deploy.yaml'

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Query production D1 read-only
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi

          WRANGLER="npx --yes wrangler@4.98.0"
          CUTOFF=1791110862000

          echo "=== POST_DEPLOY_STATUS_COUNTS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT status, COUNT(*) AS count
            FROM ai_task
            WHERE scene='genjutsu' AND updated_at >= $CUTOFF
            GROUP BY status
            ORDER BY count DESC;
          "

          echo "=== POST_DEPLOY_UPLOAD_FAILURES ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              substr(id,1,8) AS id8,
              substr(user_id,1,8) AS user8,
              status,
              created_at,
              updated_at,
              json_extract(task_result,'$.errorCode') AS error_code,
              json_extract(task_result,'$.errorMessage') AS error_message,
              json_extract(task_result,'$.errorName') AS error_name,
              json_extract(task_result,'$.fileType') AS file_type,
              json_extract(task_result,'$.fileIndex') AS file_index,
              json_extract(task_result,'$.attemptCount') AS attempt_count,
              json_extract(task_result,'$.uploadElapsedMs') AS elapsed_ms,
              json_extract(task_result,'$.browser') AS browser,
              json_extract(task_result,'$.browserMajor') AS browser_major,
              json_extract(task_result,'$.os') AS os,
              json_extract(task_result,'$.isWebView') AS is_webview,
              json_extract(task_result,'$.inAppBrowser') AS in_app_browser,
              json_extract(task_result,'$.effectiveType') AS effective_type,
              json_extract(task_result,'$.rttMs') AS rtt_ms,
              json_extract(task_result,'$.downlinkMbps') AS downlink_mbps,
              json_extract(task_result,'$.origin') AS origin,
              json_extract(task_result,'$.uploadHost') AS upload_host,
              json_extract(task_result,'$.cfCountry') AS cf_country,
              json_extract(task_result,'$.cfColo') AS cf_colo,
              json_extract(task_result,'$.cfAsn') AS cf_asn,
              json_extract(task_result,'$.r2InspectionStatus') AS r2_status,
              json_extract(task_result,'$.r2ObjectExists') AS r2_exists,
              json_extract(task_result,'$.attempts') AS attempts,
              json_extract(options,'$.contentLengths[0]') AS video_bytes
            FROM ai_task
            WHERE scene='genjutsu'
              AND updated_at >= $CUTOFF
              AND json_extract(task_result,'$.stage')='upload'
            ORDER BY updated_at DESC
            LIMIT 100;
          "

          echo "=== POST_DEPLOY_RETRY_SUCCESSES ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              substr(id,1,8) AS id8,
              substr(user_id,1,8) AS user8,
              status,
              created_at,
              updated_at,
              json_extract(task_info,'$.uploadRetrySuccesses') AS retry_successes,
              json_extract(options,'$.contentLengths[0]') AS video_bytes
            FROM ai_task
            WHERE scene='genjutsu'
              AND updated_at >= $CUTOFF
              AND json_type(task_info,'$.uploadRetrySuccesses')='array'
              AND json_array_length(json_extract(task_info,'$.uploadRetrySuccesses')) > 0
            ORDER BY updated_at DESC
            LIMIT 100;
          "


          echo "=== FAILURE_USER_HISTORY_TODAY ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              substr(id,1,8) AS id8,
              status,
              created_at,
              updated_at,
              json_extract(task_result,'$.stage') AS failure_stage,
              json_extract(task_result,'$.errorCode') AS error_code,
              json_extract(task_result,'$.browser') AS browser,
              json_extract(task_result,'$.os') AS os,
              json_extract(task_result,'$.r2InspectionStatus') AS r2_status,
              json_extract(options,'$.contentLengths[0]') AS video_bytes,
              json_extract(task_info,'$.uploadRetrySuccesses') AS retry_successes
            FROM ai_task
            WHERE scene='genjutsu'
              AND substr(user_id,1,8)='8c88f8b6'
              AND created_at >= 1791043200000
            ORDER BY created_at ASC;
          "

          echo "=== ALL_TODAY_UPLOAD_FAILURES_SAME_USER ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              substr(id,1,8) AS id8,
              created_at,
              json_extract(task_result,'$.errorCode') AS error_code,
              json_extract(task_result,'$.attemptCount') AS attempt_count,
              json_extract(task_result,'$.uploadElapsedMs') AS elapsed_ms,
              json_extract(task_result,'$.browser') AS browser,
              json_extract(task_result,'$.os') AS os,
              json_extract(task_result,'$.r2InspectionStatus') AS r2_status,
              json_extract(options,'$.contentLengths[0]') AS video_bytes
            FROM ai_task
            WHERE scene='genjutsu'
              AND substr(user_id,1,8)='8c88f8b6'
              AND created_at >= 1791043200000
              AND json_extract(task_result,'$.stage')='upload'
            ORDER BY created_at ASC;
          "

          echo "=== NEW_DIAGNOSTIC_FIELD_COVERAGE ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              COUNT(*) AS upload_failures,
              SUM(CASE WHEN json_extract(task_result,'$.errorMessage') IS NOT NULL THEN 1 ELSE 0 END) AS with_error_message,
              SUM(CASE WHEN json_extract(task_result,'$.browserMajor') IS NOT NULL THEN 1 ELSE 0 END) AS with_browser_major,
              SUM(CASE WHEN json_extract(task_result,'$.isWebView') IS NOT NULL THEN 1 ELSE 0 END) AS with_webview_flag,
              SUM(CASE WHEN json_type(task_result,'$.attempts')='array' THEN 1 ELSE 0 END) AS with_attempts,
              SUM(CASE WHEN json_extract(task_result,'$.cfColo') IS NOT NULL THEN 1 ELSE 0 END) AS with_cf_colo
            FROM ai_task
            WHERE scene='genjutsu'
              AND updated_at >= $CUTOFF
              AND json_extract(task_result,'$.stage')='upload';
          "
