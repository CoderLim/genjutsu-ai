# Read-only targeted paid-user diagnostics. Never deploys production.
name: Diagnose Paid User Failures

on:
  push:
    branches: ['diagnose/post-p0-upload-20261004']
    paths:
      - '.github/workflows/cloudflare-deploy.yaml'

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query production D1 read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"; unset CLOUDFLARE_API_KEY; fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"; else export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"; fi
          fi
          W="npx --yes wrangler@4.98.0"

          echo "=== HIGH_VALUE_PAID_USER_TASKS ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            SELECT substr(id,1,8) id8,status,created_at,updated_at,provider,model,cost_credits,
                   json_extract(options,'$.mode') mode,json_extract(options,'$.resolution') resolution,
                   json_extract(task_result,'$.errorCode') preflight_code,
                   json_extract(task_result,'$.error') error,
                   json_extract(task_result,'$.providerStatus') provider_status,
                   json_extract(task_result,'$.refundedCredits') refunded_credits,
                   json_extract(task_result,'$.stage') failure_stage,
                   json_extract(task_info,'$.attemptStage') attempt_stage,
                   json_extract(task_info,'$.providerCostUsd') provider_cost_usd,
                   substr(COALESCE(credit_id,''),1,8) credit8
            FROM ai_task
            WHERE scene='genjutsu' AND substr(user_id,1,8)='7ea08762'
            ORDER BY created_at ASC;
          "

          echo "=== STARTER_FAILED_USER_TASKS ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            SELECT substr(id,1,8) id8,status,created_at,updated_at,provider,model,cost_credits,
                   json_extract(task_result,'$.errorCode') preflight_code,
                   json_extract(task_result,'$.errorMessage') error_message,
                   json_extract(task_result,'$.error') error,
                   json_extract(task_result,'$.r2InspectionStatus') r2_status,
                   json_extract(task_result,'$.browser') browser,
                   json_extract(task_result,'$.os') os,
                   json_extract(task_info,'$.attemptStage') attempt_stage
            FROM ai_task
            WHERE scene='genjutsu' AND substr(user_id,1,8)='ccb9f7d7'
            ORDER BY created_at ASC;
          "

          echo "=== DUPLICATE_GRANT_ORDER_ROWS ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            SELECT substr(id,1,8) credit8,transaction_type,transaction_scene,credits,remaining_credits,
                   description,status,created_at,metadata
            FROM credit
            WHERE order_no=(SELECT order_no FROM 'order' WHERE substr(user_id,1,8)='cc53fa54' AND status='paid' LIMIT 1)
            ORDER BY created_at ASC;
          "

          echo "=== SMOKE_COMPLETED_TASK ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            SELECT substr(t.id,1,8) id8,t.status,t.cost_credits,t.created_at,t.updated_at,
                   json_extract(t.task_result,'$.providerStatus') provider_status,
                   CASE WHEN json_extract(t.task_result,'$.videoKey') IS NOT NULL OR json_extract(t.task_result,'$.videoUrl') IS NOT NULL THEN 1 ELSE 0 END has_result,
                   c.status credit_status,c.credits credit_delta
            FROM ai_task t LEFT JOIN credit c ON c.id=t.credit_id
            WHERE t.scene='genjutsu' AND substr(t.user_id,1,8)='06e2ba7b' AND t.status='completed';
          "
