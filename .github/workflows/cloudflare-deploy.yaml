# Read-only paid-user pricing diagnostics. Never deploys production.
name: Diagnose Paid Credit Sufficiency

on:
  push:
    branches: ['diagnose/post-p0-upload-20261004']
    paths:
      - '.github/workflows/cloudflare-deploy.yaml'

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query production D1 read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"; unset CLOUDFLARE_API_KEY; fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"; else export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"; fi
          fi
          W="npx --yes wrangler@4.98.0"

          echo "=== PAID_USER_INSUFFICIENT_DETAILS ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            WITH p AS (
              SELECT user_id,MIN(paid_at) first_paid_at
              FROM 'order' WHERE status='paid' AND paid_at IS NOT NULL GROUP BY user_id
            )
            SELECT substr(t.id,1,8) id8,substr(t.user_id,1,8) user8,t.created_at,
                   json_extract(t.options,'$.mode') mode,json_extract(t.options,'$.resolution') resolution,
                   json_extract(t.task_result,'$.requiredCredits') required_credits,
                   json_extract(t.task_result,'$.balance') balance_in_result,
                   t.cost_credits,t.status
            FROM ai_task t JOIN p ON p.user_id=t.user_id AND t.created_at>=p.first_paid_at
            WHERE t.scene='genjutsu' AND t.status='insufficient_credits'
            ORDER BY t.created_at ASC;
          "

          echo "=== PAID_USER_CURRENT_BALANCES ==="
          $W d1 execute genjutsu-ai-db --remote --json --command "
            WITH p AS (
              SELECT user_id,COUNT(*) paid_orders,SUM(credits_amount) purchased_credits
              FROM 'order' WHERE status='paid' GROUP BY user_id
            )
            SELECT substr(p.user_id,1,8) user8,p.paid_orders,p.purchased_credits,
                   COALESCE(SUM(CASE WHEN c.transaction_type='grant' AND c.status='active' THEN c.remaining_credits ELSE 0 END),0) current_balance
            FROM p LEFT JOIN credit c ON c.user_id=p.user_id
            GROUP BY p.user_id,p.paid_orders,p.purchased_credits
            ORDER BY p.user_id;
          "
