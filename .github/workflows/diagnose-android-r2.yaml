name: Diagnose Android R2 Uploads

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/diagnose-android-r2.yaml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi
          {
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}"
            echo "CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}"
            echo "CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}"
          } >> "$GITHUB_ENV"

      - name: Check origin routing and successful retry
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.98.0"

          echo "=== ORIGIN_ROUTING ==="
          for url in https://genjutsuai.net/ https://www.genjutsuai.net/; do
            echo "-- $url"
            curl -sS -I --max-time 20 "$url" | sed -n '1p;/^location:/Ip;/^server:/Ip;/^cf-ray:/Ip'
          done

          echo "=== RETRY_SUCCEEDED_RECORDS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              datetime(created_at/1000,'unixepoch') AS created_utc,
              substr(id,1,8) AS id8,
              json_extract(task_info, '$.uploadRetrySuccesses[0].browser') AS browser,
              json_extract(task_info, '$.uploadRetrySuccesses[0].os') AS os,
              json_extract(task_info, '$.uploadRetrySuccesses[0].attemptCount') AS attempts,
              json_extract(task_info, '$.uploadRetrySuccesses[0].uploadElapsedMs') AS elapsed_ms,
              status
            FROM ai_task
            WHERE scene='genjutsu'
              AND json_array_length(json_extract(task_info, '$.uploadRetrySuccesses')) > 0
              AND created_at >= 1791043200000
            ORDER BY created_at DESC;
          "

          echo "=== ANDROID_FAILURES_PER_USER ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT failures, COUNT(*) AS users
            FROM (
              SELECT user_id, COUNT(*) AS failures
              FROM ai_task
              WHERE scene='genjutsu'
                AND json_extract(task_result, '$.errorCode')='UPLOAD_NETWORK_ERROR'
                AND json_extract(task_result, '$.os')='Android'
                AND created_at >= 1791043200000
              GROUP BY user_id
            )
            GROUP BY failures
            ORDER BY failures DESC;
          "
