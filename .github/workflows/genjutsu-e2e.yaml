name: Genjutsu E2E

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  genjutsu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Genjutsu E2E
        run: pnpm e2e:genjutsu
