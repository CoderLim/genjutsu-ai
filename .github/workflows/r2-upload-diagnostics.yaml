name: R2 Upload Diagnostics

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/r2-upload-diagnostics.yaml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY_FALLBACK: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_KEY"
            unset CLOUDFLARE_API_KEY
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_KEY_FALLBACK:-}" ]; then
            if [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_API_KEY="${CLOUDFLARE_API_KEY:-$CF_API_KEY_FALLBACK}"
            else
              export CLOUDFLARE_API_TOKEN="$CF_API_KEY_FALLBACK"
            fi
          fi
          {
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}"
            echo "CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}"
            echo "CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}"
          } >> "$GITHUB_ENV"

      - name: Inspect production upload failures and R2 CORS
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.98.0"

          echo "=== RECENT_UPLOAD_FAILURES ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              COUNT(*) AS failures,
              COUNT(DISTINCT user_id) AS users,
              MIN(datetime(created_at / 1000, 'unixepoch')) AS first_utc,
              MAX(datetime(created_at / 1000, 'unixepoch')) AS last_utc
            FROM ai_task
            WHERE scene='genjutsu'
              AND status='failed_preflight'
              AND json_extract(task_result, '$.stage')='upload';
          "

          echo "=== UPLOAD_FAILURE_BREAKDOWN ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              json_extract(task_result, '$.errorCode') AS error_code,
              json_extract(task_result, '$.fileType') AS file_type,
              json_extract(task_result, '$.fileIndex') AS file_index,
              json_extract(task_result, '$.httpStatus') AS http_status,
              COUNT(*) AS count,
              COUNT(DISTINCT user_id) AS users
            FROM ai_task
            WHERE scene='genjutsu'
              AND status='failed_preflight'
              AND json_extract(task_result, '$.stage')='upload'
            GROUP BY error_code, file_type, file_index, http_status
            ORDER BY count DESC;
          "

          echo "=== FAILED_VIDEO_INPUTS ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              COALESCE(json_extract(options, '$.contentTypes[0]'), '(none)') AS video_type,
              CASE
                WHEN CAST(json_extract(options, '$.contentLengths[0]') AS INTEGER) < 5242880 THEN '<5MB'
                WHEN CAST(json_extract(options, '$.contentLengths[0]') AS INTEGER) < 20971520 THEN '5-20MB'
                WHEN CAST(json_extract(options, '$.contentLengths[0]') AS INTEGER) < 52428800 THEN '20-50MB'
                WHEN CAST(json_extract(options, '$.contentLengths[0]') AS INTEGER) < 104857600 THEN '50-100MB'
                ELSE '100-200MB'
              END AS size_bucket,
              COUNT(*) AS count,
              COUNT(DISTINCT user_id) AS users
            FROM ai_task
            WHERE scene='genjutsu'
              AND status='failed_preflight'
              AND json_extract(task_result, '$.stage')='upload'
            GROUP BY video_type, size_bucket
            ORDER BY count DESC;
          "

          echo "=== SINCE_FIRST_FAILURE_FUNNEL ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            SELECT
              status,
              COALESCE(json_extract(task_info, '$.attemptStage'), '(none)') AS attempt_stage,
              COUNT(*) AS count,
              COUNT(DISTINCT user_id) AS users
            FROM ai_task
            WHERE scene='genjutsu'
              AND created_at >= (strftime('%s','2026-10-03 21:01:58') * 1000)
            GROUP BY status, attempt_stage
            ORDER BY count DESC;
          "

          echo "=== FAILURES_PER_USER ==="
          $WRANGLER d1 execute genjutsu-ai-db --remote --json --command "
            WITH per_user AS (
              SELECT user_id, COUNT(*) AS attempts
              FROM ai_task
              WHERE scene='genjutsu'
                AND status='failed_preflight'
                AND json_extract(task_result, '$.stage')='upload'
              GROUP BY user_id
            )
            SELECT attempts, COUNT(*) AS users
            FROM per_user
            GROUP BY attempts
            ORDER BY attempts;
          "

          echo "=== R2_BUCKET ==="
          BUCKET="$($WRANGLER d1 execute genjutsu-ai-db --remote --json --command "SELECT value FROM config WHERE name='r2_bucket_name' LIMIT 1;" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=(j[0]?.results||[])[0];process.stdout.write(r?.value||'')})")"
          echo "bucket=$BUCKET"
          if [ -z "$BUCKET" ]; then
            echo "No r2_bucket_name configured"
            exit 2
          fi

          echo "=== R2_CORS_API ==="
          set +e
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            curl --silent --show-error -i \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/cors"
          else
            curl --silent --show-error -i \
              -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
              -H "X-Auth-Key: $CLOUDFLARE_API_KEY" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/cors"
          fi
          set -e
          echo

          echo "=== R2_BROWSER_PREFLIGHT ==="
          ENDPOINT="$($WRANGLER d1 execute genjutsu-ai-db --remote --json --command "SELECT value FROM config WHERE name='r2_endpoint' LIMIT 1;" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=(j[0]?.results||[])[0];process.stdout.write(r?.value||'')})")"
          UPLOAD_PATH="$($WRANGLER d1 execute genjutsu-ai-db --remote --json --command "SELECT value FROM config WHERE name='r2_upload_path' LIMIT 1;" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=(j[0]?.results||[])[0];process.stdout.write(r?.value||'uploads')})")"
          TEST_URL="${ENDPOINT%/}/$BUCKET/${UPLOAD_PATH#/}/genjutsu/diagnostics/cors-test.mp4"
          ENDPOINT="$ENDPOINT" node -e "try{console.log('endpoint_host='+new URL(process.env.ENDPOINT).host)}catch{console.log('endpoint_host=(invalid)')}"
          set +e
          curl --silent --show-error -i -X OPTIONS "$TEST_URL" \
            -H "Origin: https://genjutsuai.net" \
            -H "Access-Control-Request-Method: PUT" \
            -H "Access-Control-Request-Headers: content-type"
          set -e
          echo
